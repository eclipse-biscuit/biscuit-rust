name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, v5]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target/
          key: ${{ runner.os }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('Cargo.toml') }}
            ${{ runner.os }}-
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Build
        run: cargo build --locked --verbose
      - name: Run tests
        run: cargo test --locked --features="serde-error,bwk" --verbose
      - name: Check samples
        run: |
          cd biscuit-auth
          cargo run --locked --release --example testcases --features serde-error,unsafe-protobuf-access -- ./samples --json > ./samples/samples.json
          git diff --exit-code

  licenses:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DASH_VERSION: 1.1.0
      DASH_SHA256: ba4e84e1981f0e51f92a42ec8fc8b9668dabb08d1279afde46b8414e11752b06

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache the Eclipse Dash license tool
        id: dash-cache
        uses: actions/cache@v4
        with:
          path: dash-licenses.jar
          key: dash-licenses-${{ env.DASH_VERSION }}
      - name: Download the Eclipse Dash license tool
        if: steps.dash-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o dash-licenses.jar \
            https://clementd-files.cellar-c2.services.clever-cloud.com/org.eclipse.dash.licenses-$DASH_VERSION.jar
      - name: Verify the Eclipse Dash license tool
        run: echo "$DASH_SHA256  dash-licenses.jar" | sha256sum -c
      - name: Check dependency licenses
        # the tool exits with the number of dependencies that are not approved
        shell: bash
        run: |
          cargo tree --locked -e normal --prefix none --no-dedupe \
            | sort -u \
            | grep -v '^[[:space:]]*$' \
            | grep -v biscuit \
            | sed -E 's|([^ ]+) v([^ ]+).*|crate/cratesio/-/\1/\2|' \
            | java -jar dash-licenses.jar -summary DEPENDENCIES -
      - name: Upload the license summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-licenses
          path: DEPENDENCIES

  capi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Install cargo-c
        env:
          LINK: https://github.com/lu-zero/cargo-c/releases/download
          CARGO_C_FILE: cargo-c-x86_64-unknown-linux-musl.tar.gz
          CARGO_C_VERSION: v0.10.13
        run: |
          curl -L $LINK/$CARGO_C_VERSION/$CARGO_C_FILE | tar xz -C ~/.cargo/bin
      - name: Run cargo-c tests
        run: cargo ctest --release

  wasi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1
      - name: Check biscuit-auth
        run: cargo check -p biscuit-auth --target wasm32-wasip1
      - name: Check biscuit-capi
        run: cargo check -p biscuit-capi --target wasm32-wasip1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        uses: actions-rs/cargo@v1
        with:
          command: install
          args: cargo-tarpaulin
      - name: Run cargo tarpaulin
        uses: actions-rs/cargo@v1
        with:
          command: tarpaulin
          # biscuit-quote only has a trybuild compile-fail test, which exceeds
          # tarpaulin's per-test timeout and yields no coverage (proc macros run
          # inside rustc, outside the traced test binary).
          args: --output-dir coverage --out xml --workspace --exclude biscuit-quote --features serde-error,unsafe-protobuf-access --tests --example testcases --example third_party
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: biscuit-auth/biscuit-rust
