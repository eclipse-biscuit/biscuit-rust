[package]
name = "biscuit-quote"
version = "0.3.0"
edition = "2021"
description = "macros for compile time datalog parsing for Biscuit authorization tokens"
authors = ["Clément Delafargue <clement@delafargue.name>", "Geoffroy Couprie <contact@geoffroycouprie.com>"]
license = "Apache-2.0"
documentation = "https://docs.rs/biscuit-auth"
homepage = "https://github.com/eclipse-biscuit/biscuit"
repository = "https://github.com/eclipse-biscuit/biscuit-rust"

[lib]
proc-macro = true

[dependencies]
biscuit-parser = { path = "../biscuit-parser", features = ["datalog-macro"], version = "0.2.0" }
proc-macro2 = "1"
quote = "1.0.14"
syn = { version = "2.0.117", features = ["full", "extra-traits"] }
manyhow = "0.11"

[dev-dependencies]
biscuit-auth = { path = "../biscuit-auth" }
hex = "0.4.3"
trybuild = "1.0.116"
